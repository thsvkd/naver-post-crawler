[project]
name = "naver-post-crawler"
version = "0.1.2"
description = "네이버 블로그·카페의 글을 과거→최근 순으로 txt 파일로 백업하는 크롤러"
readme = "README.md"
authors = [{ name = "thsvkd", email = "thsxogud1123@gmail.com" }]
# flet build가 번들에 임베드하는 인터프리터는 CPython 3.12다(참조 산출물 tarball 실측).
# 개발 환경을 배포 인터프리터에 맞춰야 "개발에서는 되는데 배포본이 import 단계에서 죽는"
# 문법·API 차이를 개발 중에 잡을 수 있다. 하한을 올릴 때는 .python-version과
# [tool.ruff] target-version, tests/test_python_compat.py의 _TARGET_PYTHON을 함께 올린다.
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    # GUI(flet)는 이 앱의 일급 기능(run.py 무인자 = GUI)이므로 기본 의존성으로 둔다.
    # optional extra로 두면 uv가 명령마다 환경을 재동기화하며 flet을 설치/삭제 반복한다.
    # "flet>=0.85",
    # flet build는 이 제약으로 번들용 flet을 따로 설치하므로 >=로 두면 최신을 끌어와
    # flet-cli가 만든 UI 클라이언트(Flutter) 버전과 어긋난다. 그러면 앱은 뜨지만 화면이
    # 그려지지 않는다(빈 창). dev 그룹의 flet-cli와 **정확히 같은 버전**으로 고정한다.
    "flet-desktop==0.85.1",
    "httpx>=0.28.1",
    # 세션 자격증명(네이버 로그인 쿠키)을 OS 보관소에 넣는다 — macOS 키체인,
    # Windows 자격 증명 관리자. 평문 파일로 두면 앱을 지워도 자격증명이 디스크에 남고,
    # 평소에도 노출된 상태가 된다. macOS/Windows 백엔드는 순수 파이썬 + ctypes라
    # 네이티브 확장 없이 번들에 들어간다(백엔드는 credentials.py가 명시 지정한다).
    "keyring>=25.0",
    "rich>=15.0.0",
    "selectolax>=0.4.9",
    # 앱 내 웹뷰 네이버 로그인(cookie_login). pywebview로 네이티브 웹뷰를 별도
    # 프로세스에 띄워 HttpOnly 세션 쿠키를 수거한다. Windows 백엔드(WebView2)는
    # pythonnet으로 .NET 상호운용하므로 win32에서만 함께 설치한다(WebView2 런타임은
    # Win11 기본 탑재). macOS 백엔드(Cocoa/WebKit)는 pywebview가 darwin 마커로
    # pyobjc 계열을 직접 끌어오므로 여기에 따로 적지 않는다.
    "pywebview>=6.0",
    "pythonnet>=3.0 ; sys_platform == 'win32'",
    # 설치/자동 업데이트(Velopack). abi3 네이티브 확장이라 flet이 임베드하는 파이썬
    # 버전과 무관하게 번들에 들어간다. import만으로 0.5초 이상 걸리므로 앱 기동 경로에서
    # 부르지 않는다(velopack_update가 함수 안에서 지연 임포트한다).
    "velopack>=1.2.0",
]

[project.scripts]
naver-post-crawler = "naver_post_crawler.cli:main"
naver-post-crawler-gui = "naver_post_crawler.gui:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
# flet-cli는 `flet build`(scripts/build.py의 유일한 빌드 경로) 실행에 쓰는 `flet` CLI를
# 제공한다. 선언하지 않으면 `uv sync`가 매번 "불필요"로 보고 제거하고, 직후 빌드가
# 다시 설치해 설치/삭제가 반복된다. dev 그룹에 두면 sync가 보존해 이 churn을 없앤다.
# flet-cli는 UI 클라이언트(Flutter) 버전을 결정하므로 번들되는 flet-desktop과 반드시
# 같은 버전이어야 한다(불일치 시 빈 창).
dev = ["pytest>=9.0.3", "ruff>=0.15.13", "flet-cli==0.85.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# yt-knowledge-extractor와 같은 설정을 쓴다(두 저장소의 빌드·배포 스크립트를 서로
# 이식하므로 규칙이 갈리면 옮길 때마다 린트가 터진다).
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # ProgramFiles(x86)·OneDrive 같은 이름은 Windows가 실제로 쓰는 표기다. 대문자로 바꿔도
    # 동작은 같지만(파이썬이 Windows에서 키를 대문자로 정규화한다), 원본 표기를 유지하는
    # 편이 무엇을 읽는지 분명하다. 지금 이 저장소에는 해당하는 코드가 없지만, 설정을
    # 같게 두어야 스크립트를 옮겨 올 때 갈리지 않는다.
    "SIM112",
]

[tool.ruff.lint.per-file-ignores]
# 테스트의 중첩 with는 바깥이 mock, 안쪽이 assertRaises인 형태가 대부분이다. 하나로 합치면
# assertRaises의 적용 범위가 넓어져 "무엇이 예외를 던져야 하는지"가 흐려진다.
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.flet.app]
# src-layout이므로 flet build가 src/ 아래에서 진입 모듈을 찾도록 지정한다.
# (app.path는 CLI 옵션이 없어 pyproject.toml이 유일한 설정 위치다.)
# module은 점을 확장자 구분자로 다루므로 dotted 패키지 경로(naver_post_crawler.gui)는
# naver_post_crawler.py를 찾다 실패한다. 앱 루트의 main.py 셔임을 진입점으로 둔다.
module = "main"
path = "src"
